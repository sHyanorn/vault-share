services:
  vaultd:
    build: .
    environment:
      VAULT_BASE_URL: https://${VAULT_DOMAIN:-localhost}
      VAULT_MAX_FILE_BYTES: ${VAULT_MAX_FILE_BYTES:-1073741824}
      VAULT_LOG_LEVEL: ${VAULT_LOG_LEVEL:-info}
    volumes:
      - vault-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9-alpine@sha256:e8d293dca35c033c4eb958d77b9096098e34da2987da3954acc0028267c6cc9b
    environment:
      VAULT_DOMAIN: ${VAULT_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on: [vaultd]
    restart: unless-stopped

volumes:
  vault-data:
  caddy-data:
  caddy-config:
