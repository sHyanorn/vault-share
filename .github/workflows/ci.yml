name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    env:
      VAULT_TEST_S3_ENDPOINT: http://127.0.0.1:7070
      VAULT_TEST_S3_BUCKET: vault-test
      VAULT_TEST_S3_ACCESS_KEY_ID: test-access-key
      VAULT_TEST_S3_SECRET_ACCESS_KEY: test-secret-key
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      # The S3-compatible service of compose.s3.yaml, for the S3 store tests (D025).
      - name: Start the S3 test service
        working-directory: .
        run: docker compose -f compose.yaml -f compose.s3.yaml up --detach --wait s3
      # No cached results: the service, not only the code, is under test.
      - run: go test -race -count=1 ./...
      - run: go run -modfile=tools/go.mod golang.org/x/vuln/cmd/govulncheck ./...
      - run: go run -modfile=tools/go.mod github.com/securego/gosec/v2/cmd/gosec -quiet ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
  # The crypto vectors in each browser engine's own Web Crypto. WebKit also
  # runs on macOS, whose build uses another crypto backend than Linux's.
  browsers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium firefox webkit
          - os: macos-15
            browsers: webkit
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npm run test:browsers -- $(printf -- '--project %s ' ${{ matrix.browsers }})
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # A fresh vaultd of its own, so the tests have the client's whole budget.
      - name: Damaged downloads against a local vaultd
        run: |
          npm run build
          (cd ../server && go build -o "$RUNNER_TEMP/vaultd" ./cmd/vaultd)
          mkdir "$RUNNER_TEMP/data"
          VAULT_LISTEN_ADDR=127.0.0.1:8080 VAULT_BASE_URL=http://localhost:8080 \
            VAULT_DATA_DIR="$RUNNER_TEMP/data" VAULT_WEB_DIR="$PWD/dist" "$RUNNER_TEMP/vaultd" &
          curl --silent --fail --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8080/healthz > /dev/null
          E2E_BASE_URL=http://localhost:8080 E2E_ENGINES="${{ matrix.browsers }}" npx playwright test -g 'damaged download'
  # The Python implementation in crosscheck/ and the client each open what
  # the other makes, with new keys on every run.
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r crosscheck/requirements.txt
      - name: Python opens what the client makes
        run: |
          node web/scripts/crosscheck.ts generate client.json
          .venv/bin/python crosscheck/crosscheck.py check client.json
      - name: The client opens what Python makes
        run: |
          .venv/bin/python crosscheck/crosscheck.py generate python.json
          node web/scripts/crosscheck.ts check python.json
      - name: The fixed vectors are what Python writes
        run: .venv/bin/python crosscheck/crosscheck.py check-vectors testdata/share_format_test.json
  # The client must build byte for byte the same in the Dockerfile's image
  # (musl), on glibc Linux on x64 and arm64, and on macOS, whose bundler and
  # CSS minifier are each a native binary of their own.
  reproducible:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: node-alpine-amd64, os: ubuntu-latest, docker: true }
          - { name: ubuntu-x64, os: ubuntu-24.04 }
          - { name: ubuntu-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build in the Dockerfile's web stage
        if: matrix.docker
        run: |
          docker build --target web --tag web-build .
          docker run --rm web-build sh -c 'echo "node $(node --version), Alpine $(cat /etc/alpine-release), $(uname -m)"' > env.txt
          docker run --rm web-build sh -c 'cd dist && find . -type f | LC_ALL=C sort | xargs sha256sum' > hashes.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !matrix.docker }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build on the runner
        if: ${{ !matrix.docker }}
        run: |
          (cd web && npm ci --ignore-scripts && npm run build)
          echo "node $(node --version), ${{ matrix.os }}, $(uname -sm)" > env.txt
          (cd web/dist && find . -type f | LC_ALL=C sort | xargs shasum -a 256) > hashes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-${{ matrix.name }}
          path: |
            env.txt
            hashes.txt
  reproducible-compare:
    needs: reproducible
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Every platform built the same client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'web-build-*' --dir builds
          cd builds
          for build in *; do
            printf '### %s\n%s\n```\n%s\n```\n' "$build" "$(cat "$build/env.txt")" "$(cat "$build/hashes.txt")"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(ls | wc -l)" -eq 4
          for build in *; do
            diff web-build-node-alpine-amd64/hashes.txt "$build/hashes.txt"
          done
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm --volume "$PWD:/src" --workdir /src
          semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
          semgrep scan --config p/golang --config p/typescript --config p/react --config p/secrets
          --error --metrics=off --exclude node_modules --exclude dist
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build --detach --wait
      - run: curl --fail --silent --show-error --insecure --retry 10 --retry-delay 2 --retry-all-errors https://localhost/healthz
      - name: ZAP baseline scan
        run: |
          chmod 777 .zap
          docker run --rm --network host --volume "$PWD/.zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t https://localhost -c rules.tsv -r report.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: .zap/report.html
          if-no-files-found: ignore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The manifest comes from a build on the runner, its CSP from vaultd
      # itself; the stack, behind Caddy, must serve exactly that. A second
      # vaultd from the same image serves a copy of the stack's client.
      - name: The served client matches a manifest of a separate build
        run: |
          (cd web && npm run build)
          (cd server && go build -o ../webcheck ./cmd/webcheck)
          docker compose cp vaultd:/srv/web served
          image=$(docker compose images --quiet vaultd)
          serve() {
            docker run --detach --publish "127.0.0.1:$2:8080" --env "VAULT_BASE_URL=http://localhost:$2" \
              --volume "$PWD/$1:/srv/web:ro" "$image" > /dev/null
            curl --silent --fail --retry 10 --retry-delay 1 --retry-all-errors "http://localhost:$2/healthz" > /dev/null
          }
          serve served 8081
          csp=$(curl --silent --head http://localhost:8081/ | tr -d '\r' | sed -n 's/^content-security-policy: //Ip')
          ./webcheck manifest -dir web/dist -csp "$csp" > manifest.json
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt root.crt
          ./webcheck verify -manifest manifest.json -cafile root.crt https://localhost
          ./webcheck verify -manifest manifest.json http://localhost:8081
          # One changed byte in one script, served the same way, must be
          # found, and nothing else.
          cp -r served changed
          script=$(cd changed && ls assets/*.js | head -1)
          python3 -c 'import sys; b = bytearray(open(sys.argv[1], "rb").read()); b[1000] ^= 1; open(sys.argv[1], "wb").write(b)' "changed/$script"
          serve changed 8082
          code=0
          ./webcheck verify -manifest manifest.json http://localhost:8082 > changed.txt || code=$?
          cat changed.txt
          test "$code" -eq 1
          grep -qx '1 difference(s) from the manifest' changed.txt
          grep -q "^changed  /$script " changed.txt
      - name: End-to-end tests
        working-directory: web
        run: npm run e2e
      - name: Browser security checks
        run: NODE_PATH="$PWD/web/node_modules" node scripts/browser_checks.cjs https://localhost
      # Last: its rate-limit check spends the client's create budget.
      - name: Black-box security checks
        run: |
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt root.crt
          python3 scripts/blackbox.py https://localhost --cafile root.crt --http-url http://localhost
      # A request that fails at Caddy is logged with its URI (F68). The 502
      # entry must be there with the token replaced, and the token nowhere.
      - name: Caddy logs no download token
        run: |
          docker compose stop vaultd
          path=/api/v1/files/AAAAAAAAAAAAAAAAAAAAAA/content
          token=CHECK$(openssl rand -hex 16)
          status=$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' "https://localhost$path?token=$token")
          docker compose logs caddy > caddy.log
          test "$status" = 502 || { echo "status $status"; exit 1; }
          grep -F "\"uri\":\"$path?token=REDACTED\"" caddy.log | grep -qF '"status":502' || { cat caddy.log; exit 1; }
          if grep -F "$token" caddy.log; then exit 1; fi
      - name: Move the stack to S3
        run: |
          docker compose down --volumes
          echo "COMPOSE_FILE=compose.yaml:compose.s3.yaml" >> "$GITHUB_ENV"
      - name: End-to-end tests on S3
        run: |
          docker compose up --detach --wait
          # Chromium cancels requests in flight with ERR_NETWORK_CHANGED when a
          # host address changes, and the new network's interfaces keep their
          # IPv6 addresses tentative for a moment after the containers start.
          ip -6 address show tentative
          timeout 30 sh -c 'while [ -n "$(ip -6 address show tentative)" ]; do sleep 0.2; done'
          (cd web && npm run e2e)
          # Every test share ends burned or deleted, so the bucket must be
          # empty, and through those deletes: the orphan sweep found nothing.
          curl --silent --show-error --fail --aws-sigv4 aws:amz:us-east-1:s3 \
            --user test-access-key:test-secret-key 'http://127.0.0.1:7070/vault?list-type=2' > listing.xml
          grep -q '<KeyCount>0</KeyCount>' listing.xml || { cat listing.xml; exit 1; }
          if docker compose logs vaultd | grep 'deleted orphaned content'; then
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: web/test-results
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
