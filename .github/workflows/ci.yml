name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      # An S3-compatible service for the S3 blob store tests (D025).
      s3:
        image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
        env:
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          ROOT_ACCESS_KEY_ID: test-access-key
          ROOT_SECRET_ACCESS_KEY: test-secret-key
        options: --tmpfs /data
        ports:
          - 7070:7070
    env:
      VAULT_TEST_S3_ENDPOINT: http://localhost:7070
      VAULT_TEST_S3_BUCKET: vault-test
      VAULT_TEST_S3_ACCESS_KEY_ID: test-access-key
      VAULT_TEST_S3_SECRET_ACCESS_KEY: test-secret-key
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: curl --silent --output /dev/null --retry 20 --retry-delay 1 --retry-connrefused http://localhost:7070
      - run: go test -race ./...
      - run: go run -modfile=tools/go.mod golang.org/x/vuln/cmd/govulncheck ./...
      - run: go run -modfile=tools/go.mod github.com/securego/gosec/v2/cmd/gosec -quiet ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm --volume "$PWD:/src" --workdir /src
          semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
          semgrep scan --config p/golang --config p/typescript --config p/react --config p/secrets
          --error --metrics=off --exclude node_modules --exclude dist
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build --detach --wait
      - run: curl --fail --silent --show-error --insecure --retry 10 --retry-delay 2 --retry-all-errors https://localhost/healthz
      - name: ZAP baseline scan
        run: |
          chmod 777 .zap
          docker run --rm --network host --volume "$PWD/.zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t https://localhost -c rules.tsv -r report.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: .zap/report.html
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
