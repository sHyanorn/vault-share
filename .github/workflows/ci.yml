name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    env:
      VAULT_TEST_S3_ENDPOINT: http://127.0.0.1:7070
      VAULT_TEST_S3_BUCKET: vault-test
      VAULT_TEST_S3_ACCESS_KEY_ID: test-access-key
      VAULT_TEST_S3_SECRET_ACCESS_KEY: test-secret-key
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      # The S3-compatible service of compose.s3.yaml, for the S3 store tests (D025).
      - name: Start the S3 test service
        working-directory: .
        run: docker compose -f compose.yaml -f compose.s3.yaml up --detach --wait s3
      # No cached results: the service, not only the code, is under test.
      - run: go test -race -count=1 ./...
      - run: go run -modfile=tools/go.mod golang.org/x/vuln/cmd/govulncheck ./...
      - run: go run -modfile=tools/go.mod github.com/securego/gosec/v2/cmd/gosec -quiet ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm --volume "$PWD:/src" --workdir /src
          semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
          semgrep scan --config p/golang --config p/typescript --config p/react --config p/secrets
          --error --metrics=off --exclude node_modules --exclude dist
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build --detach --wait
      - run: curl --fail --silent --show-error --insecure --retry 10 --retry-delay 2 --retry-all-errors https://localhost/healthz
      - name: ZAP baseline scan
        run: |
          chmod 777 .zap
          docker run --rm --network host --volume "$PWD/.zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t https://localhost -c rules.tsv -r report.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: .zap/report.html
          if-no-files-found: ignore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: npm run e2e
      - name: Browser security checks
        run: NODE_PATH="$PWD/web/node_modules" node scripts/browser_checks.cjs https://localhost
      # Last: its rate-limit check spends the client's create budget.
      - name: Black-box security checks
        run: |
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt root.crt
          python3 scripts/blackbox.py https://localhost --cafile root.crt --http-url http://localhost
      - name: Move the stack to S3
        run: |
          docker compose down --volumes
          echo "COMPOSE_FILE=compose.yaml:compose.s3.yaml" >> "$GITHUB_ENV"
      - name: End-to-end tests on S3
        run: |
          docker compose up --detach --wait
          (cd web && npm run e2e)
          # Every test share ends burned or deleted, so the bucket must be empty.
          curl --silent --show-error --fail --aws-sigv4 aws:amz:us-east-1:s3 \
            --user test-access-key:test-secret-key 'http://127.0.0.1:7070/vault?list-type=2' > listing.xml
          grep -q '<KeyCount>0</KeyCount>' listing.xml || { cat listing.xml; exit 1; }
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
